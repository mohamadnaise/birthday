
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عيد ميلاد 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;
    min-height:100vh;overflow-x:hidden;color:#4a2c4d;text-align:center;
    background:linear-gradient(135deg,#ff9a9e,#fecfef,#a18cd1,#fbc2eb,#ffd1dc);
    background-size:400% 400%;animation:bg 14s ease infinite;
  }
  @keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
  .balloon{position:fixed;bottom:-70px;z-index:1;animation:floatUp linear infinite;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
  @keyframes floatUp{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-120vh) rotate(6deg)}}
  main{position:relative;z-index:5;padding:34px 16px 60px;max-width:640px;margin:0 auto}
  h1{font-size:clamp(1.7rem,6vw,2.6rem);font-weight:900;text-shadow:0 2px 0 rgba(255,255,255,.6)}
  h1 .name{color:#d6336c}
  #hint{margin:10px auto 26px;max-width:420px;font-size:1.05rem;background:rgba(255,255,255,.55);padding:10px 18px;border-radius:99px;backdrop-filter:blur(4px);display:inline-block}
  .stage{display:flex;flex-direction:column;align-items:center;margin-bottom:26px}
  .plate{width:300px;max-width:80vw;height:26px;border-radius:50%;background:linear-gradient(#e9e9f2,#c9c9d8);box-shadow:0 10px 24px rgba(90,40,90,.25)}
  .cake{position:relative;width:240px;max-width:70vw;margin-bottom:-8px;cursor:pointer;transition:transform .15s}
  .cake:active{transform:scale(.97)}
  .layer{position:relative;margin:0 auto;border-radius:14px;box-shadow:inset 0 -8px 14px rgba(0,0,0,.08)}
  .l1{height:72px;width:240px;max-width:70vw;background:linear-gradient(#ff8fb3,#f76d9a)}
  .l2{height:60px;width:192px;background:linear-gradient(#ffc2d4,#ff9ebc)}
  .l3{height:56px;width:144px;background:linear-gradient(#ffffff,#ffe3ec)}
  .spr{position:absolute;width:9px;height:3px;border-radius:2px;opacity:.95}
  .candle{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);width:16px;height:58px;
    background:repeating-linear-gradient(45deg,#4cc9f0 0 6px,#ffffff 6px 12px);border-radius:5px 5px 0 0}
  .candle::before{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:3px;height:7px;background:#333;border-radius:2px}
  .flame{position:absolute;bottom:calc(100% + 6px);left:50%;width:22px;height:38px;transform:translateX(-50%);
    background:radial-gradient(ellipse at 50% 75%,#fff7ae 0%,#ffd93d 35%,#ff9f1c 70%,#ff5e3a 100%);
    border-radius:50% 50% 50% 50%/62% 62% 38% 38%;transform-origin:50% 100%;
    filter:drop-shadow(0 0 10px #ffb703) drop-shadow(0 0 22px rgba(255,140,0,.55));
    animation:flick .16s infinite alternate ease-in-out;transition:opacity .45s,transform .45s}
  @keyframes flick{from{transform:translateX(-50%) scale(1) rotate(-2.5deg)}to{transform:translateX(-50%) scale(1.09,.93) rotate(2.5deg)}}
  .candle.blown .flame{opacity:0;transform:translateX(-50%) scale(.05)}
  .smoke span{position:absolute;bottom:calc(100% + 4px);left:50%;width:10px;height:10px;border-radius:50%;background:rgba(190,190,190,.75);filter:blur(4px);opacity:0}
  .candle.blown .smoke span{animation:smoke 1.4s ease-out forwards}
  .candle.blown .smoke span:nth-child(2){animation-delay:.15s;left:44%}
  .candle.blown .smoke span:nth-child(3){animation-delay:.3s;left:56%}
  @keyframes smoke{0%{opacity:.85;transform:translate(-50%,0) scale(.6)}100%{opacity:0;transform:translate(-50%,-50px) scale(2.4)}}
  .controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;margin-bottom:10px}
  button{font-family:inherit;font-weight:700;font-size:1rem;border:none;cursor:pointer;border-radius:99px;
    padding:13px 26px;color:#7a2b54;background:rgba(255,255,255,.9);box-shadow:0 6px 16px rgba(150,60,110,.25);
    transition:transform .15s,box-shadow .15s;user-select:none}
  button:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 10px 22px rgba(150,60,110,.35)}
  button:active{transform:scale(.96)}
  button:disabled{opacity:.6;cursor:default;transform:none}
  .meter{width:230px;max-width:80vw;height:12px;background:rgba(255,255,255,.4);border-radius:99px;overflow:hidden;margin:6px auto 4px}
  .meter>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#7bed9f,#ffd93d,#ff6b6b);transition:width .05s linear}
  .meter-label{font-size:.85rem;opacity:.8;margin-bottom:20px}
  #messages{max-width:560px;margin:10px auto 0}
  .msg{background:rgba(255,255,255,.88);backdrop-filter:blur(6px);border-radius:18px;padding:15px 22px;margin:12px auto;
    font-size:1.15rem;font-weight:700;box-shadow:0 8px 20px rgba(120,50,100,.18);max-width:92%;
    opacity:0;transform:translateY(16px);transition:opacity .5s,transform .5s}
  .msg.show{opacity:1;transform:none}
  .msg.finale{font-size:1.5rem;font-weight:900;color:#d6336c;background:linear-gradient(90deg,#fff,#ffe3ec)}
  #again{display:none;margin-top:26px}
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<main>
  <h1 id="title">🎂 عيد ميلاد <span class="name"></span> 🎂</h1>
  <div><span id="hint"></span></div>

  <div class="stage">
    <div class="cake" id="cake" title="اضغطي هنا тоже">
      <div class="layer l3"></div>
      <div class="layer l2"></div>
      <div class="layer l1"></div>
      <div class="candle" id="candle">
        <div class="flame" id="flame"></div>
        <div class="smoke"><span></span><span></span><span></span></div>
      </div>
    </div>
    <div class="plate"></div>
  </div>

  <div class="controls">
    <button id="micBtn">🎤 فعّلي المايك وانفخي</button>
    <button id="blowBtn">👆 اضغطي وانفخي الشمعة</button>
  </div>
  <div class="meter"><i id="meterBar"></i></div>
  <div class="meter-label">مستوى الصوت (لما تنفخي Мpua…)</div>

  <div id="messages"></div>
  <button id="again">🔁 نحاولها من جديد</button>
</main>

<script>
/* ====== عدّلي الاسم هنا، أو أرسليه بالرابط: eid.html?name=سارة ====== */
const NAME = new URLSearchParams(location.search).get("name") || "عمي زينة 🌸";
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ====== جمل المعايدة (صداقة/أخوة) — عدّليها براحتك ====== */
const MESSAGES = [
  `كل سنة وإنتِ بخير ${NAME} 💛`,
  `كل سنة وانتي سالمة يارب 🎂✨`,
  `بتمنالك سنة مليانة ضحك ونجاحات و انشالله بتحققي كلشي تتمنّيه 🌟`,
  `🎉 كل عام وإنتِ بخير ${NAME} 🎉`
];

/* ====== balloons ====== */
const EMOJI = ["🎈","🎉","⭐","💛","🎁","🧡"];
for(let i=0;i<9;i++){
  const b=document.createElement("span");
  b.className="balloon"; b.textContent=EMOJI[i%EMOJI.length];
  b.style.left=(Math.random()*92)+"%";
  b.style.fontSize=(26+Math.random()*22)+"px";
  b.style.animationDuration=(9+Math.random()*9)+"s";
  b.style.animationDelay=(-Math.random()*14)+"s";
  document.body.appendChild(b);
}

/* ====== sprinkles ====== */
const SPRC=["#ffffff","#ffd93d","#6bcbef","#a78bfa","#ff6b6b","#7bed9f"];
document.querySelectorAll(".layer").forEach(l=>{
  for(let i=0;i<14;i++){
    const s=document.createElement("i"); s.className="spr";
    s.style.left=(4+Math.random()*92)+"%"; s.style.top=(18+Math.random()*64)+"%";
    s.style.background=SPRC[i%SPRC.length];
    s.style.transform=`rotate(${Math.random()*360}deg)`;
    l.appendChild(s);
  }
});

/* ====== title & hint ====== */
document.title = "عيد ميلاد "+NAME+" 🎂";
document.querySelector("h1 .name").textContent = NAME;
const hint = document.getElementById("hint");
hint.textContent = `🌬️ انفخي الشمعة يا ${NAME} — بالمايك أو بالضغط على الزر`;

const candle = document.getElementById("candle");
const cake = document.getElementById("cake");
let blown = false;

/* ====== confetti (بدون إنترنت) ====== */
const cvs=document.getElementById("confetti"), ctx=cvs.getContext("2d");
let parts=[], confettiOn=false;
function resize(){cvs.width=innerWidth;cvs.height=innerHeight}
addEventListener("resize",resize); resize();
const COLORS=["#ff6b9d","#ffd93d","#6bcbef","#a78bfa","#7bed9f","#ff9f43"];
function burst(x,y,n){
  for(let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-.5)*15,vy:-(Math.random()*13+4),
    s:Math.random()*8+4,c:COLORS[(Math.random()*COLORS.length)|0],r:Math.random()*6.28,vr:(Math.random()-.5)*.3,life:Math.random()*90+70});
}
function loop(){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  parts=parts.filter(p=>p.life>0&&p.y<cvs.height+50);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.99;p.r+=p.vr;p.life--;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
    ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.62);ctx.restore();}
  if(parts.length||confettiOn) requestAnimationFrame(loop); else ctx.clearRect(0,0,cvs.width,cvs.height);
}
function confettiShow(){
  confettiOn=true; loop();
  const iv=setInterval(()=>{
    burst(Math.random()*cvs.width, cvs.height+10, 34);
    burst(0, cvs.height*.45, 12); burst(cvs.width, cvs.height*.45, 12);
  }, 320);
  setTimeout(()=>{clearInterval(iv); confettiOn=false;}, 7500);
}

/* ====== لحن عيد ميلاد (WebAudio — بدون ملف) ====== */
let audioCtx=null;
function playBirthday(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    audioCtx=audioCtx||new AC();
    if(audioCtx.state==="suspended") audioCtx.resume();
    const beat=.27;
    const N=[[392,.5],[392,.5],[440,1],[392,1],[523.25,1],[493.88,2],
             [392,.5],[392,.5],[440,1],[392,1],[587.33,1],[523.25,2],
             [392,.5],[392,.5],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,2],
             [698.46,.5],[698.46,.5],[659.25,1],[523.25,1],[587.33,1],[523.25,2]];
    let t=audioCtx.currentTime+.15;
    for(const [f,d] of N){
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type="triangle"; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.22,t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+beat*d*.95);
      o.connect(g).connect(audioCtx.destination);
      o.start(t); o.stop(t+beat*d); t+=beat*d;
    }
  }catch(e){}
}

/* ====== إظهار الجمل تلو التلو ====== */
const msgsBox=document.getElementById("messages");
function showMessages(){
  MESSAGES.forEach((m,i)=>{
    setTimeout(()=>{
      const el=document.createElement("div");
      el.className="msg"+(i===MESSAGES.length-1?" finale":"");
      msgsBox.appendChild(el);
      requestAnimationFrame(()=>el.classList.add("show"));
      let j=0; const iv=setInterval(()=>{el.textContent=m.slice(0,++j); if(j>=m.length) clearInterval(iv);},26);
    }, 900+i*2800);
  });
  setTimeout(()=>{document.getElementById("again").style.display="inline-block";}, 900+MESSAGES.length*2800);
}

/* ====== الانفخ ====== */
function doBlow(){
  if(blown) return; blown=true;
  if(rafId) cancelAnimationFrame(rafId);
  if(micStream) micStream.getTracks().forEach(t=>t.stop());
  candle.classList.add("blown");
  hint.textContent="💨 انطفأت الشمعة!happy birthday 🎉";
  document.getElementById("micBtn").disabled=true;
  document.getElementById("blowBtn").disabled=true;
  confettiShow(); playBirthday(); showMessages();
}

/* زر الانفخ */
document.getElementById("blowBtn").addEventListener("click",doBlow);
cake.addEventListener("pointerdown",doBlow);
addEventListener("keydown",e=>{if((e.key===" "||e.key==="Enter")&&!blown) doBlow();});

/* ====== المايك (كشف الانفخ بالصوت) ====== */
const micBtn=document.getElementById("micBtn"), meterBar=document.getElementById("meterBar");
let micStream=null, rafId=null;
micBtn.addEventListener("click", async ()=>{
  if(blown) return;
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    const AC=window.AudioContext||window.webkitAudioContext;
    audioCtx=audioCtx||new AC(); if(audioCtx.state==="suspended") audioCtx.resume();
    const src=audioCtx.createMediaStreamSource(micStream);
    const analyser=audioCtx.createAnalyser(); analyser.fftSize=2048;
    src.connect(analyser);
    const data=new Uint8Array(analyser.fftSize);
    let above=0;
    const tick=()=>{
      analyser.getByteTimeDomainData(data);
      let sum=0;
      for(let i=0;i<data.length;i+=4){const d=(data[i]-128)/128; sum+=d*d;}
      const rms=Math.sqrt(sum/(data.length/4));
      meterBar.style.width=Math.min(100,rms*520)+"%";
      if(rms>0.09){ above++; if(above>7){doBlow();return;} }
      else above=Math.max(0,above-2);
      if(!blown) rafId=requestAnimationFrame(tick);
    };
    tick();
    micBtn.textContent="🎤 المايك شغال — انفخي الآن!";
    micBtn.disabled=true;
  }catch(e){
    micBtn.textContent="❌ المايك مش متاح — استخدمي زر الانفخ 👆";
  }
});

document.getElementById("again").addEventListener("click",()=>location.reload());
</script>
</body>
</html>
